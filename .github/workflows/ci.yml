name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --quiet pytest
      - name: Byte-compile all Python sources
        run: python -m compileall -q szl_ledger tests
      - name: Run test suite
        run: python -m pytest -q tests
