[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "szl-ledger"
version = "0.1.0"
description = "Versioned append-only ledger for the SZL Holdings governed-AI estate: schema szl.ledger/v1, deterministic JSONL, SHA-256 chaining, fail-closed validation CLI."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "SZL Holdings" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
]

[project.scripts]
szl-ledger = "szl_ledger.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["szl_ledger"]
